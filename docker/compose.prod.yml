# Topologia completa de produção do Athlyt: banco, migração e app web.
#
# Roda igual em qualquer VPS com Docker (`docker compose -f
# docker/compose.prod.yml up -d`) e no Dokploy, que consome este mesmo
# arquivo. Nenhum recurso é específico de um provedor — migrar de host
# é copiar o repositório, o arquivo de variáveis e o dump do volume.
#
# Nome distinto do compose de desenvolvimento ("athlyt") para que os
# dois possam coexistir na mesma máquina sem que um enxergue os
# containers do outro como órfãos.
name: athlyt-prod

services:
  # Nome deliberadamente qualificado, não `db`: os serviços do compose
  # ganham alias de DNS na rede a que pertencem, e a `dokploy-network` é
  # compartilhada com os outros projetos do painel. Dois containers com o
  # alias `db` fazem o Docker responder em round-robin, e o app vizinho
  # cai num Postgres que não conhece as credenciais dele — falha
  # intermitente com SQLSTATE 28P01. Alias único elimina a ambiguidade.
  athlyt-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
    volumes:
      - athlyt-prod-db:/var/lib/postgresql/data
    # Sem porta publicada: o banco só é alcançável pela rede interna
    # do compose. Acesso administrativo se faz por `docker compose
    # exec athlyt-db psql`, não expondo a 5432 à internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - interna

  # Serviço efêmero: aplica as migrações e sai. O app só sobe depois
  # que este termina com sucesso, o que elimina a janela em que código
  # novo consultaria um schema antigo.
  #
  # Repete o bloco `build` do app de propósito: as duas definições
  # apontam para a mesma tag, então o Compose constrói a imagem uma
  # única vez e ambos os serviços a reaproveitam.
  migracao:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@athlyt-db:5432/${POSTGRES_DB}
    image: athlyt-app:${APP_TAG:-latest}
    command: ["node", "scripts/migrar.mjs"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@athlyt-db:5432/${POSTGRES_DB}
    depends_on:
      athlyt-db:
        condition: service_healthy
    restart: "no"
    networks:
      - interna

  # Nome `web`, não `app`: na dokploy-network — compartilhada por
  # todos os serviços do host — o Compose registra o nome do serviço
  # como alias DNS. Dois projetos com um serviço `app` produzem duas
  # entradas `app` na mesma rede, e o DNS do Docker passa a alternar
  # entre containers de aplicações distintas.
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # O build importa `src/db/client.ts`, que exige a variável.
        # O valor não precisa ser alcançável em build time — o cliente
        # do postgres.js só abre conexão na primeira query.
        DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@athlyt-db:5432/${POSTGRES_DB}
    image: athlyt-app:${APP_TAG:-latest}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@athlyt-db:5432/${POSTGRES_DB}

      # Auth.js. AUTH_URL precisa ser o domínio público real: sem ele
      # o callback do Google é montado com o host interno e a resposta
      # é redirect_uri_mismatch.
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:?defina AUTH_URL}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?defina AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?defina AUTH_GOOGLE_SECRET}

      # OpenRouter (ADR 0005). IA_AMBIENTE=producao usa os modelos
      # pagos; o default derivado do NODE_ENV já seria esse, mas
      # explícito evita surpresa de custo.
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?defina OPENROUTER_API_KEY}
      IA_AMBIENTE: ${IA_AMBIENTE:-producao}

      # Cloudflare R2 (ADR 0003). Use bucket de produção, nunca o
      # bucket de testes (docs/storage-r2-tests.md).
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?defina R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?defina R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?defina R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:?defina R2_BUCKET}

      APP_ENV: ${APP_ENV:-producao}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-athlyt}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migracao:
        condition: service_completed_successfully
    # Sem `ports`: no Dokploy quem alcança o container é o Traefik,
    # pela dokploy-network, e publicar a porta no host só cria
    # conflito — o próprio painel do Dokploy ocupa a 3000, e o deploy
    # falhava com "port is already allocated".
    #
    # Numa VPS sem Dokploy, o proxy local precisa da porta: suba com
    # `-f docker/compose.prod.yml -f docker/compose.prod.porta.yml`,
    # que a publica no loopback.
    # A imagem não tem curl; o node embutido já traz fetch.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Sem `labels` aqui: o Dokploy injeta os labels de roteamento do
    # Traefik no serviço com domínio, e um bloco `labels` no compose
    # versionado substitui esse conjunto em vez de somar a ele. Ajuste
    # de proxy pertence ao painel, não a este arquivo.
    networks:
      - interna
      # Rede do Dokploy/Traefik. Declarada como externa: numa VPS sem
      # Dokploy, remova esta linha e o bloco correspondente em
      # `networks`.
      - dokploy-network

  # Dump diário do Postgres para o bucket S3/R2, com expurgo por
  # idade. Serviço separado do app porque seu ciclo de vida é outro:
  # um redeploy da aplicação não deve interromper a janela de backup.
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: athlyt-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Padrão: todo dia às 03:00 (UTC dentro do container).
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_AO_INICIAR: ${BACKUP_AO_INICIAR:-false}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-30}

      # Cloudflare R2 fala o protocolo S3. Por padrão reaproveita as
      # credenciais R2 do app; use um bucket DIFERENTE do de fotos,
      # para que a retenção de dumps não alcance dado de usuário.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-${R2_ACCESS_KEY_ID}}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-${R2_SECRET_ACCESS_KEY}}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?defina BACKUP_S3_BUCKET}
      BACKUP_S3_PREFIXO: ${BACKUP_S3_PREFIXO:-athlyt/postgres}
    depends_on:
      athlyt-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - interna

volumes:
  athlyt-prod-db:

networks:
  interna:
  dokploy-network:
    external: true
