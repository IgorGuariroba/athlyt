name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # Portão barato: erros de estilo/tipo param a esteira em ~1 min.
  estatica:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unidade:
    name: Testes de unidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-secret
          DATABASE_URL: postgres://athlyt:athlyt@localhost:5432/athlyt

  # E2E real em navegador (viewport mobile) contra Postgres efêmero,
  # conforme specs/mvp-vertical.md > Testing Decisions.
  e2e:
    name: E2E mobile
    runs-on: ubuntu-latest
    needs: [estatica, unidade]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: athlyt
          POSTGRES_PASSWORD: athlyt
          POSTGRES_DB: athlyt
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://athlyt:athlyt@localhost:5432/athlyt
      AUTH_SECRET: ci-e2e-secret
      AUTH_URL: http://localhost:3000
      IA_AMBIENTE: desenvolvimento
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run test:e2e
      - name: Evidências (vídeo, trace, relatório)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Trava regressão de vulnerabilidade: o repo já corrige CVEs via
  # "overrides" no package.json e não deve perder esse chão.
  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
