name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versão exata, não a faixa "24": o npm que acompanha cada patch do
  # Node resolve o lockfile de forma um pouco diferente, e uma faixa
  # deixa `npm ci` quebrar sozinho quando o runner atualiza.
  NODE_VERSION: "24.18.0"

jobs:
  # O ruleset "main protegida" exige os 5 checks deste workflow. Filtrar
  # por `paths:` no gatilho deixaria os checks eternamente "pending" e
  # travaria o merge; job pulado por `if:` reporta "success". Por isso o
  # escopo é decidido aqui dentro, e não no `on:`.
  escopo:
    name: Escopo da mudança
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      codigo: ${{ steps.avaliar.outputs.codigo }}
    steps:
      - id: avaliar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          arquivos=$(gh api --paginate \
            repos/${{ github.repository }}/pulls/${{ github.event.number }}/files \
            --jq '.[].filename')
          # Allowlist curta e explícita do que não pode quebrar o produto.
          # Qualquer outro caminho — inclusive `.github/**`, para que uma
          # mudança de workflow se autovalide — roda a esteira inteira.
          restantes=$(echo "$arquivos" | grep -Ev '^(\.claude/|docs/|\.vscode/)|\.md$' || true)
          if [ -n "$restantes" ]; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          fi

  # Portão barato: erros de estilo/tipo param a esteira em ~1 min.
  estatica:
    name: Lint e tipos
    runs-on: ubuntu-latest
    needs: [escopo]
    if: needs.escopo.outputs.codigo == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Governança do design system
        run: npm run ui:verificar
      # Render e a11y das stories saíram daqui: custavam 4 min 16 s e,
      # como `e2e` esperava por este job, atrasavam o único portão que
      # exercita o produto de verdade. Migraram para
      # `.github/workflows/galeria.yml` (nightly + manual).

  # Portão rápido: *.unit.test.ts não toca infraestrutura nenhuma, então
  # este job não provisiona banco de propósito — se algum teste passar a
  # exigir Postgres, a falha aqui é o sinal de que ele deveria ser .int.
  unidade:
    name: Testes de unidade
    runs-on: ubuntu-latest
    needs: [escopo]
    if: needs.escopo.outputs.codigo == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # *.int.test.ts exercitam Drizzle contra um Postgres real.
  integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    needs: [escopo]
    if: needs.escopo.outputs.codigo == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: athlyt
          POSTGRES_PASSWORD: athlyt
          POSTGRES_DB: athlyt
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://athlyt:athlyt@localhost:5432/athlyt
      AUTH_SECRET: ci-int-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:int

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    needs: [escopo]
    if: needs.escopo.outputs.codigo == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-secret
          DATABASE_URL: postgres://athlyt:athlyt@localhost:5432/athlyt
      # O standalone não inclui os estáticos nem `public` sozinho:
      # copiar CSS/JS, manifesto, ícones e o worker de desativação.
      - name: Preparar build standalone
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      # O E2E roda contra este mesmo build em vez de recompilar sob
      # demanda em `next dev`. Publicar só o standalone também deixa de
      # transportar os ~350 MB de `.next/cache`, que o servidor não lê.
      - name: Publicar o build para o E2E
        uses: actions/upload-artifact@v4
        with:
          name: build-producao
          path: .next/standalone
          retention-days: 1
          include-hidden-files: true

  # E2E real em navegador (viewport mobile) contra Postgres efêmero.
  e2e:
    name: E2E mobile
    runs-on: ubuntu-latest
    # Só o artefato de build é pré-requisito real. Antes esperava
    # também `estatica`/`unidade`/`integracao`, o que empurrava o E2E
    # para o minuto 6 de uma esteira de 8. Rodando em paralelo, uma
    # falha barata continua reprovando o PR — apenas não serializa.
    # Um PR sem código pula `build`, e o skip propaga para cá.
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: athlyt
          POSTGRES_PASSWORD: athlyt
          POSTGRES_DB: athlyt
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://athlyt:athlyt@localhost:5432/athlyt
      AUTH_SECRET: ci-e2e-secret
      AUTH_URL: http://localhost:3000
      IA_AMBIENTE: desenvolvimento
      # Serve o build de produção baixado do job `build`. Em `next dev`
      # cada rota compila na primeira visita, com o cronômetro do teste
      # correndo: a suíte media 2,0 min, contra 52 s aqui — e os picos
      # eram compilação, não fluxo (a Triagem caía de 32 s para 15 s).
      E2E_COMANDO: node .next/standalone/server.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build-producao
          path: .next/standalone
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run test:e2e
      - name: Evidências (vídeo, trace, relatório)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # A auditoria saiu do PR: o resultado de `npm audit` muda por
  # publicação de CVE, não por commit, então bloquear cada PR com ela
  # gera falha alheia à mudança. Ver `.github/workflows/auditoria.yml`.
